name: CI Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make wget libgmp-dev libmpfr-dev libmpc-dev flex bison

      - name: Setup PS2DEV Environment
        run: |
          sudo mkdir -p /usr/local/ps2dev
          sudo chown -R $USER:$USER /usr/local/ps2dev
          git clone --depth 1 https://github.com/ps2dev/ps2dev.git /tmp/ps2dev
          cd /tmp/ps2dev
          ./build-all.sh

      - name: Compile PS2-Launcher
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2SDK/bin
          make clean || true
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Launcher-ELF
          path: "*.ELF"